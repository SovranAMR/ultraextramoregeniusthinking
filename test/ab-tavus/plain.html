<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tavus Kuşu</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: radial-gradient(ellipse at 50% 30%, #2a4538 0%, #141f18 70%);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .frame {
      width: min(900px, 98vw);
      aspect-ratio: 3 / 4;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    svg {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div class="frame">
    <svg viewBox="0 0 720 960" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Gerçekçi tavus kuşu illüstrasyonu">
      <defs>
        <linearGradient id="bg-sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#1e3428"/>
          <stop offset="60%" stop-color="#3d5c42"/>
          <stop offset="100%" stop-color="#526b48"/>
        </linearGradient>

        <linearGradient id="teal-iri" x1="0%" y1="20%" x2="100%" y2="80%">
          <stop offset="0%" stop-color="#064a52"/>
          <stop offset="30%" stop-color="#0a7888"/>
          <stop offset="55%" stop-color="#18a8b0"/>
          <stop offset="80%" stop-color="#0c6878"/>
          <stop offset="100%" stop-color="#054048"/>
        </linearGradient>

        <linearGradient id="blue-iri" x1="10%" y1="0%" x2="90%" y2="100%">
          <stop offset="0%" stop-color="#0a3058"/>
          <stop offset="35%" stop-color="#145890"/>
          <stop offset="60%" stop-color="#2088b8"/>
          <stop offset="100%" stop-color="#084868"/>
        </linearGradient>

        <linearGradient id="neck-iri" x1="0%" y1="100%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#1a6858"/>
          <stop offset="45%" stop-color="#0c9888"/>
          <stop offset="100%" stop-color="#086878"/>
        </linearGradient>

        <linearGradient id="gold-breast" x1="15%" y1="5%" x2="85%" y2="95%">
          <stop offset="0%" stop-color="#dcc040"/>
          <stop offset="30%" stop-color="#b8c038"/>
          <stop offset="60%" stop-color="#8a9830"/>
          <stop offset="100%" stop-color="#607028"/>
        </linearGradient>

        <linearGradient id="breast-hi" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#f0e070" stop-opacity="0.5"/>
          <stop offset="100%" stop-color="#90a030" stop-opacity="0"/>
        </linearGradient>

        <linearGradient id="feather-barb" x1="50%" y1="100%" x2="50%" y2="0%">
          <stop offset="0%" stop-color="#183828"/>
          <stop offset="50%" stop-color="#1a6850"/>
          <stop offset="100%" stop-color="#0c5878"/>
        </linearGradient>

        <radialGradient id="eye-spot" cx="48%" cy="46%" r="52%">
          <stop offset="0%" stop-color="#060e18"/>
          <stop offset="8%" stop-color="#0a1828"/>
          <stop offset="18%" stop-color="#104878"/>
          <stop offset="32%" stop-color="#1888b0"/>
          <stop offset="46%" stop-color="#40b8c8"/>
          <stop offset="58%" stop-color="#c8a028"/>
          <stop offset="72%" stop-color="#907818"/>
          <stop offset="86%" stop-color="#285838"/>
          <stop offset="100%" stop-color="#142818"/>
        </radialGradient>

        <radialGradient id="eye-spot-glow" cx="45%" cy="42%" r="45%">
          <stop offset="0%" stop-color="#081018" stop-opacity="0"/>
          <stop offset="40%" stop-color="#2898b0" stop-opacity="0.25"/>
          <stop offset="70%" stop-color="#c0a030" stop-opacity="0.15"/>
          <stop offset="100%" stop-color="#081018" stop-opacity="0"/>
        </radialGradient>

        <linearGradient id="head-grad" x1="0%" y1="40%" x2="100%" y2="60%">
          <stop offset="0%" stop-color="#1a5870"/>
          <stop offset="100%" stop-color="#0c3858"/>
        </linearGradient>

        <filter id="drop" x="-15%" y="-15%" width="130%" height="130%">
          <feDropShadow dx="1" dy="3" stdDeviation="3" flood-color="#081008" flood-opacity="0.4"/>
        </filter>

        <!-- Kuyruk tüyü -->
        <g id="feather">
          <path d="M0,0 C-3,-35 -6,-80 -5,-130 C-3,-170 -1,-210 0,-240
                   C1,-210 3,-170 5,-130 C6,-80 3,-35 0,0Z" fill="url(#feather-barb)"/>
          <ellipse cx="0" cy="-128" rx="20" ry="26" fill="url(#eye-spot)"/>
          <ellipse cx="0" cy="-128" rx="20" ry="26" fill="url(#eye-spot-glow)"/>
          <ellipse cx="-2" cy="-132" rx="3.5" ry="4.5" fill="#060c14"/>
          <path d="M-16,-88 Q0,-102 16,-88 L12,-138 Q0,-152 -12,-138Z" fill="url(#teal-iri)" opacity="0.3"/>
        </g>
      </defs>

      <rect width="720" height="960" fill="url(#bg-sky)"/>
      <ellipse cx="360" cy="900" rx="380" ry="55" fill="#2a4828" opacity="0.55"/>

      <!-- Ana kompozisyon -->
      <g transform="translate(360, 640)" filter="url(#drop)">

        <!-- KUYRUK FANI (train) -->
        <g id="train">
          <use href="#feather" transform="rotate(-78) scale(1.12)"/>
          <use href="#feather" transform="rotate(-66) scale(1.14)"/>
          <use href="#feather" transform="rotate(-54) scale(1.16)"/>
          <use href="#feather" transform="rotate(-42) scale(1.18)"/>
          <use href="#feather" transform="rotate(-30) scale(1.2)"/>
          <use href="#feather" transform="rotate(-18) scale(1.22)"/>
          <use href="#feather" transform="rotate(-6) scale(1.24)"/>
          <use href="#feather" transform="rotate(6) scale(1.24)"/>
          <use href="#feather" transform="rotate(18) scale(1.22)"/>
          <use href="#feather" transform="rotate(30) scale(1.2)"/>
          <use href="#feather" transform="rotate(42) scale(1.18)"/>
          <use href="#feather" transform="rotate(54) scale(1.16)"/>
          <use href="#feather" transform="rotate(66) scale(1.14)"/>
          <use href="#feather" transform="rotate(78) scale(1.12)"/>
          <!-- İç sıra -->
          <g transform="translate(0,18)">
            <use href="#feather" transform="rotate(-60) scale(0.9)" opacity="0.82"/>
            <use href="#feather" transform="rotate(-40) scale(0.92)" opacity="0.85"/>
            <use href="#feather" transform="rotate(-20) scale(0.94)" opacity="0.88"/>
            <use href="#feather" transform="rotate(0) scale(0.95)" opacity="0.9"/>
            <use href="#feather" transform="rotate(20) scale(0.94)" opacity="0.88"/>
            <use href="#feather" transform="rotate(40) scale(0.92)" opacity="0.85"/>
            <use href="#feather" transform="rotate(60) scale(0.9)" opacity="0.82"/>
          </g>
          <!-- Dolgu -->
          <path d="M-90,-50 Q0,-280 90,-50 Q50,-160 0,-220 Q-50,-160 -90,-50Z" fill="url(#blue-iri)" opacity="0.35"/>
        </g>

        <!-- GÖVDE -->
        <g id="body">
          <!-- Sırt / kanat -->
          <path d="M15,-35 Q55,-30 75,5 Q68,40 40,55 Q10,45 5,10 Q0,-10 15,-35Z" fill="url(#blue-iri)"/>
          <path d="M20,-15 Q48,-8 58,12 Q50,32 28,38 Q12,25 15,5Z" fill="#083858" opacity="0.35"/>

          <!-- Göğüs altın-yeşil -->
          <path d="M-5,10 Q-45,5 -50,45 Q-42,75 -10,80 Q20,72 25,40 Q22,15 -5,10Z" fill="url(#gold-breast)"/>
          <ellipse cx="-15" cy="35" rx="22" ry="28" fill="url(#breast-hi)"/>

          <!-- Sırt oval -->
          <ellipse cx="5" cy="-25" rx="50" ry="62" fill="url(#teal-iri)" transform="rotate(-6)"/>

          <!-- Boyun -->
          <path d="M-2,-50 Q-6,-95 -10,-125 Q-2,-130 8,-125 Q12,-95 8,-50Z" fill="url(#neck-iri)"/>

          <!-- Boyun tüyleri -->
          <g transform="translate(-4,-108)">
            <path d="M-14,0 C-16,-14 -18,-28 -14,-38 C-12,-40 -8,-40 -6,-38 C-4,-28 -6,-14 -8,0Z" fill="url(#neck-iri)" opacity="0.9"/>
            <path d="M-7,0 C-9,-16 -10,-30 -6,-42 C-4,-44 0,-44 2,-42 C4,-30 3,-16 1,0Z" fill="url(#teal-iri)" opacity="0.85"/>
            <path d="M0,0 C-2,-18 -2,-32 2,-44 C4,-46 8,-46 10,-44 C12,-32 10,-18 8,0Z" fill="url(#neck-iri)" opacity="0.9"/>
            <path d="M7,0 C5,-16 6,-30 10,-40 C12,-42 16,-42 18,-40 C20,-28 16,-14 14,0Z" fill="url(#teal-iri)" opacity="0.85"/>
            <path d="M14,0 C12,-14 14,-26 18,-36 C20,-38 24,-36 22,-34 C20,-24 18,-12 16,0Z" fill="url(#neck-iri)" opacity="0.8"/>
          </g>

          <!-- BAŞ -->
          <g transform="translate(-6,-138)">
            <ellipse cx="4" cy="10" rx="17" ry="13" fill="url(#head-grad)"/>
            <ellipse cx="6" cy="-6" rx="15" ry="12" fill="url(#head-grad)"/>

            <!-- İbik -->
            <g transform="translate(4,-16)">
              <path d="M-10,0 C-11,-12 -12,-22 -9,-30 C-8,-32 -6,-32 -5,-30 C-4,-22 -5,-12 -6,0Z" fill="#1a5878"/>
              <circle cx="-7" cy="-28" r="1.6" fill="#d0b030"/>
              <path d="M-5,0 C-6,-14 -6,-26 -3,-34 C-2,-36 0,-36 1,-34 C2,-26 1,-14 0,0Z" fill="#1e6888"/>
              <circle cx="-1" cy="-32" r="1.8" fill="#d8b838"/>
              <path d="M0,0 C-1,-16 0,-28 3,-38 C4,-40 6,-40 7,-38 C8,-28 6,-16 5,0Z" fill="#1a5878"/>
              <circle cx="5" cy="-36" r="2" fill="#e0c040"/>
              <path d="M5,0 C4,-14 6,-24 9,-32 C10,-34 12,-32 11,-30 C10,-22 8,-12 7,0Z" fill="#1e6888"/>
              <circle cx="9" cy="-30" r="1.6" fill="#d0b030"/>
              <path d="M10,0 C9,-12 11,-20 14,-28 C15,-30 17,-28 16,-26 C15,-18 13,-10 12,0Z" fill="#1a5878"/>
              <circle cx="14" cy="-26" r="1.4" fill="#c8a828"/>
            </g>

            <!-- Göz -->
            <ellipse cx="12" cy="-8" rx="4.2" ry="3.5" fill="#ece4cc"/>
            <circle cx="13.2" cy="-8" r="2" fill="#180c06"/>
            <circle cx="14" cy="-8.8" r="0.65" fill="#fff" opacity="0.9"/>

            <!-- Gaga -->
            <path d="M19,-7 L34,-4 Q32,-1 24,-2 L19,-4Z" fill="#281c14"/>
            <path d="M19,-4 L32,-1 Q30,2 23,1 L19,-1Z" fill="#483828"/>

            <!-- Yanak -->
            <path d="M0,-4 Q6,4 2,12 Q-2,6 0,-4Z" fill="#106080" opacity="0.45"/>
          </g>

          <!-- Kuyruk kökü -->
          <path d="M-32,8 Q0,-18 32,8 Q16,22 0,28 Q-16,22 -32,8Z" fill="url(#teal-iri)" opacity="0.88"/>

          <!-- Bacaklar -->
          <g transform="translate(0,58)">
            <path d="M-16,0 L-18,38 L-14,38 L-12,0Z" fill="#382818"/>
            <path d="M-20,38 L-16,38 L-14,46 L-18,46Z" fill="#201408"/>
            <path d="M-14,38 L-10,38 L-8,46 L-12,46Z" fill="#201408"/>
            <path d="M-18,38 L-16,38 L-15,43 L-17,43Z" fill="#100804"/>
            <path d="M6,0 L4,40 L8,40 L10,0Z" fill="#382818"/>
            <path d="M2,40 L6,40 L8,48 L4,48Z" fill="#201408"/>
            <path d="M8,40 L12,40 L14,48 L10,48Z" fill="#201408"/>
            <path d="M4,40 L6,40 L7,45 L5,45Z" fill="#100804"/>
          </g>
        </g>
      </g>

      <!-- Ön plan -->
      <g opacity="0.45">
        <path d="M80,870 Q84,830 88,870" stroke="#284820" stroke-width="1.8" fill="none"/>
        <path d="M640,865 Q644,820 648,865" stroke="#284820" stroke-width="1.8" fill="none"/>
      </g>
    </svg>
  </div>
</body>
</html>
